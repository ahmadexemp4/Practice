<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <style>
        .box {
            position: relative;
        }

        .box1 {

            border-radius: 250px;

        }

        .img {
            width: 100px;
            height: 100px;
            overflow: hidden;
            border-radius: 120px;
        }

        .box2 {
            width: 100px;
            height: auto;
            border-radius: 250px;
            position: absolute;
            top: 0px;
            left: 70px;
            z-index: 3;
        }

        .box3 {
            width: 100px;
            height: auto;
            border-radius: 250px;
            position: absolute;
            top: 0px;
            left: 130px;
            z-index: 5;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">
            <div class="box1">
                <img class="img" src="Media/images/dp.jpg" alt="">
            </div>
            <div class="box2">
                <img class="img" src="Media/images/choji.png" alt="">
            </div>
            <div class="box3">
                <img class="img" src="Media/images/gojo.png" alt="">
            </div>
        </div>
</body>

</html>
