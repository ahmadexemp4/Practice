<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIGN_UP</title>
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="css/Sign-up.css">
</head>

<body class="body">
    <div class="container">
        <h1>Sign-up page</h1>
        <div class="mb-3 row">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="exampleFormControlInput1" class="form-label">First name:</label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="First name">
                </div>
                <div class="col-md-3">
                    <label for="exampleFormControlInput1" class="form-label">Last name:</label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Last name">
                </div>
                <div class="col-md-6">
                    <label for="exampleFormControlInput1" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="Email">
                </div>
                <div class="row g-3 align-items-center col-md-4">
                    <div class="col-auto">
                        <label for="inputPassword6" class="col-form-label">Password:</label>
                    </div>
                    <div class="col-auto">
                        <input type="password" id="inputPassword6" class="form-control"
                            aria-describedby="passwordHelpInline">
                    </div>
                    <div class="col-auto">
                        <span id="passwordHelpInline" class="form-text">
                            Must be 8-12 characters long.
                        </span>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-floating">
                        <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
                            <option selected>Select menu:</option>
                            <option value="1">Matric</option>
                            <option value="2">FSC</option>
                            <option value="3">FA</option>
                            <option value="4">Other</option>
                        </select>
                        <label for="floatingSelect">Select Degree:</label>
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="exampleFormControlInput1" class="form-label">Phone number:</label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Phone number">
                </div>
                <div class="col-md-6">
                    <label for="exampleFormControlInput1" class="form-label">Address:</label>
                    <input type="text" class="form-control" id="exampleFormControlInput1" placeholder="Address">
                </div>
                <div class="col-md-3">
                    <label for="exampleDataList" class="form-label">Select District:</label>
                    <input class="form-control" list="datalistOptions" id="exampleDataList"
                        placeholder="Type to search...">
                    <datalist id="datalistOptions">
                        <option value="Bahawalpur">
                        <option value="Chistian">
                        <option value="Lahore">
                        <option value="Islamabad">
                    </datalist>
                </div>
                <div class="col-md-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label" for="checkDefault">
                            Male
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label" for="checkDefault">
                            Female
                        </label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                        <label class="form-check-label" for="checkDefault">
                            Other
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
