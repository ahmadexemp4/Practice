<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reach Me</title>
    <link rel="stylesheet" href="css/reach me.css">
</head>

<body class="background">
    <header>
        <h1 class="mainheading">Reach Me</h1>
    </header>
    <section>
        <p class="reachmep">Feel free to ask anything.I am here to assist you.Have a great day!</p>
    </section>
    <section>
        <form action="post" class="form">
            <section>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required placeholder="Your Name" class="nameform"><br><br>
            </section>
            <section>
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" required placeholder="Your Phone Number"
                    class="phoneform"><br><br>
            </section>
            <section>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required placeholder="Your Email" class="emailform"><br><br>
            </section>
            <section>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="4" cols="50" required placeholder="Your Message"
                    class="textareaform"></textarea><br><br>
            </section>
            <input type="submit" value="Submit>" class="button">
        </form>
    </section>
</body>

</html>
